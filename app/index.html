<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velvet Tide — Cast-Grid Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Velvet Tide</h1>
    <p class="lede">Cast-grid cover studio. Your photos, your caption, a poster-grade cover — all on this machine.</p>

    <fieldset>
      <legend>Photos</legend>
      <label class="file">Add photos <input id="photos" type="file" accept="image/*" multiple></label>
      <p class="hint">Drag the cover to move the selected panel. Wheel zooms it.</p>
      <div class="row">
        <label>Panel <select id="panelPick"></select></label>
        <label>Zoom <input id="zoom" type="range" min="1" max="3" step="0.01" value="1"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Layout</legend>
      <div class="row" id="layouts" role="group" aria-label="Layout"></div>
    </fieldset>

    <fieldset>
      <legend>Colour grade</legend>
      <div class="row" id="grades" role="group" aria-label="Colour grade"></div>
    </fieldset>

    <fieldset>
      <legend>Caption</legend>
      <label>Headline <input id="caption" type="text" maxlength="30" value="VELVET TIDE"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="40" value="after the last wave"></label>
      <div class="row">
        <label>Size <input id="capSize" type="range" min="0.6" max="1.5" step="0.05" value="1"></label>
        <label>Place
          <select id="capPlace">
            <option value="centre" selected>Centre</option>
            <option value="top">Top</option>
            <option value="foot">Foot</option>
          </select>
        </label>
      </div>
      <div class="row checks">
        <label><input id="capOutline" type="checkbox" checked> Outline</label>
        <label><input id="capShadow" type="checkbox" checked> Shadow</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Export PNG</legend>
      <div class="row">
        <button type="button" data-export="1080x1080">1080 x 1080</button>
        <button type="button" data-export="1080x1350">1080 x 1350</button>
        <button type="button" data-export="1920x1080">1920 x 1080</button>
      </div>
      <p id="status" role="status"></p>
    </fieldset>
  </section>
  <canvas id="stage" width="1080" height="1080" aria-label="Cover preview"></canvas>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
